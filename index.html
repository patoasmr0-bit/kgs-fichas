:root{--ink:#0B1220;--mut:#445066;--line:#B9C3D0;--bg:#EDF0F4;--c:#0B1220;--cd:#0B1220;--ct:#E6EAF0;--bad:#B42318;--ok:#15803D}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:18px;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Atkinson Hyperlegible',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;line-height:1.35;min-height:100vh}

button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
.ic{flex:none}
.in-w{max-width:640px;margin:0 auto}
.top{background:var(--c);color:#fff;padding:calc(env(safe-area-inset-top) + 12px) 16px 16px}
.top .row{display:flex;align-items:center;gap:12px;min-height:48px}
.top h1{margin:0;font-size:1.6rem;line-height:1.15}
.hx{width:48px;height:48px;border-radius:12px;border:2px solid rgba(255,255,255,.8);background:transparent;color:#fff;display:grid;place-items:center}
.stp{font-weight:700;font-size:1.05rem}
.tg{margin-left:auto;font-weight:700;background:#fff;color:var(--cd);padding:6px 12px;border-radius:99px;font-size:.95rem}

.bar i{flex:1;height:8px;border-radius:4px;background:rgba(255,255,255,.35)}

.brand{display:flex;align-items:center;gap:12px}
.bm{width:48px;height:48px;border-radius:12px;background:#fff;color:var(--ink);display:grid;place-items:center;font-weight:700;letter-spacing:.02em}
.brand b{display:block;font-size:1.25rem}
.brand span{font-size:.85rem;opacity:.85}
.sync{margin-top:12px;font-size:.85rem;display:inline-flex;gap:8px;align-items:center;background:rgba(255,255,255,.14);padding:6px 12px;border-radius:99px}
.sync i{width:10px;height:10px;border-radius:50%;background:#7CE3A1}
.sync i.w{background:#FFC857}
.pad{padding:16px 16px 40px;max-width:640px;margin:0 auto}
main.form{padding-bottom:140px}
.big{width:100%;min-height:112px;border:0;border-radius:20px;background:var(--ink);color:#fff;display:flex;align-items:center;gap:14px;padding:16px 18px;text-align:left;margin-bottom:14px}
.big .bt{flex:1;font-size:1.45rem;font-weight:700;line-height:1.15}
.chips{display:flex;gap:8px}
.chip{width:36px;height:36px;border-radius:50%;background:var(--c);color:#fff;display:grid;place-items:center;box-shadow:0 0 0 2px #fff}
.sec{font-size:1.3rem;margin:26px 0 10px}
.search{position:relative;margin-bottom:12px}
.search .ic{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--mut)}
.search .in{padding-left:46px}
.item{width:100%;display:flex;align-items:center;gap:12px;background:#fff;border:2px solid var(--line);border-left:10px solid var(--c);border-radius:14px;padding:12px;margin-bottom:10px;text-align:left;min-height:72px}
.ib{width:44px;height:44px;border-radius:12px;background:var(--ct);color:var(--cd);display:grid;place-items:center;flex:none}
.it{flex:1;min-width:0}
.it b{display:block;font-size:1.15rem;overflow-wrap:anywhere}
.it span{color:var(--mut);font-size:.95rem}
.empty{background:#fff;border:2px dashed var(--line);border-radius:16px;padding:20px;text-align:center;color:var(--mut);margin-bottom:14px}
.draft{background:#FFF7DB;border:2px solid #B7791F;border-radius:16px;padding:14px;margin:4px 0 14px}

.btn{min-height:60px;border:2px solid var(--ink);background:#fff;border-radius:14px;font-weight:700;font-size:1.1rem;padding:0 18px;display:flex;align-items:center;justify-content:center;gap:10px;text-decoration:none;color:var(--ink);text-align:center}
.btn.pri{background:var(--c);border-color:var(--c);color:#fff}
.btn.bad{color:var(--bad);border-color:var(--bad)}
.btn.wide{width:100%;margin-top:6px}
.btn.off{background:#D5DAE1;border-color:#D5DAE1;color:#5B6778}

.btn.sm{min-height:62px}
.nav{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:2px solid var(--ink);padding:12px 16px calc(env(safe-area-inset-bottom) + 12px);display:grid;grid-template-columns:1fr 1.6fr;gap:12px;z-index:20}

.fld{margin:0 0 22px}
.lab{font-weight:700;font-size:1.05rem;margin:0 0 8px}
.un{font-weight:400;color:var(--mut)}
.in{width:100%;height:62px;border:2px solid #5B6778;border-radius:14px;background:#fff;padding:0 14px;font-size:1.25rem}
.in:focus{outline:3px solid var(--c);outline-offset:1px;border-color:var(--c)}
.in.ta{height:auto;min-height:220px;padding:14px;line-height:1.4;resize:vertical}
.inu{position:relative}
.inu .in{padding-right:64px}
.inu .u{position:absolute;right:16px;top:50%;transform:translateY(-50%);font-weight:700;color:var(--mut)}
.tm{display:grid;grid-template-columns:1fr auto;gap:10px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ch{min-height:64px;border:2px solid var(--ink);background:#fff;border-radius:14px;font-weight:700;font-size:1.15rem;display:flex;align-items:center;justify-content:center;gap:8px;padding:8px 10px;text-align:center;line-height:1.15}
.ch.on{background:var(--c);border-color:var(--c);color:#fff}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pick,.cnt{display:grid;grid-template-columns:64px 1fr 64px;gap:8px;align-items:center}
.pm{height:64px;border:2px solid var(--ink);border-radius:14px;background:#fff;display:grid;place-items:center}
.pm:active{background:var(--ct)}
.sel{height:64px;font-weight:700;font-size:1.4rem;text-align:center;text-align-last:center;padding:0 8px}
.cv{text-align:center;font-size:2.2rem;font-weight:700}
.tp{width:100%;min-height:112px;border:3px solid var(--c);border-radius:20px;background:#fff;display:flex;align-items:center;gap:16px;padding:16px;margin-bottom:16px;text-align:left;color:var(--ink)}
.tpi{width:68px;height:68px;border-radius:18px;background:var(--ct);color:var(--c);display:grid;place-items:center;flex:none}
.tpt{flex:1;font-size:1.6rem}

.ch small{display:block;font-weight:400;font-size:.85rem;margin-top:2px}

.grh b{flex:1;font-size:1.15rem}
.grh .pn{width:34px;height:34px;font-size:1rem}
.pc{display:flex;gap:12px;background:#fff;border:2px solid var(--line);border-radius:16px;padding:12px;margin-bottom:12px}
.pn{width:44px;height:44px;border-radius:50%;background:var(--c);color:#fff;display:grid;place-items:center;font-weight:700;font-size:1.2rem;flex:none}
.pb{flex:1;min-width:0}
.pb b{font-size:1.15rem;display:block;overflow-wrap:anywhere}
.vals{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:6px;font-size:.95rem}

.pa{display:flex;flex-direction:column;gap:8px}
.ib2{width:48px;height:48px;border:2px solid var(--ink);background:#fff;border-radius:12px;display:grid;place-items:center}
.ib2.bad{color:var(--bad);border-color:var(--bad)}
.sm{background:#fff;border:2px solid var(--line);border-radius:16px;padding:14px;margin-bottom:14px}
.smh{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}
.smh h3{margin:0;font-size:1.15rem;color:var(--cd)}
.lnk{border:2px solid var(--c);background:#fff;color:var(--cd);border-radius:10px;padding:0 14px;font-weight:700;min-height:44px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:8px 16px;margin:0}
.kv dt{color:var(--mut)}
.kv dd{margin:0;font-weight:700;text-align:right;overflow-wrap:anywhere}
.ptb{border-top:2px solid var(--line);padding-top:12px;margin-top:12px}
.ptb:first-of-type{border-top:0;padding-top:0;margin-top:0}
.pth{display:flex;align-items:center;gap:10px;margin-bottom:8px;font-weight:700;font-size:1.1rem}
.pth .pn{width:34px;height:34px;font-size:1rem}
.obs{white-space:pre-wrap;overflow-wrap:anywhere}
.warn{background:#FFF1F0;border:2px solid var(--bad);border-radius:16px;padding:14px;margin-bottom:14px}
.warn h3{margin:0 0 8px;color:var(--bad);display:flex;gap:8px;align-items:center}
.warn div{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:6px 0;font-weight:700}
.center{text-align:center}.muted{color:var(--mut)}.strong{font-weight:700;font-size:1.25rem}
.ok{width:84px;height:84px;border-radius:50%;background:var(--c);color:#fff;display:grid;place-items:center;margin:8px auto 12px}
.fn{background:#fff;border:2px solid var(--line);border-radius:12px;padding:12px;font-size:.9rem;overflow-wrap:anywhere;margin:12px 0}
.stack{display:grid;gap:12px}
.hint{font-size:.9rem;color:var(--mut);margin:8px 0 0}
.ov{position:fixed;inset:0;background:rgba(11,18,32,.62);display:grid;place-items:center;padding:20px;z-index:60}
.dlg{background:#fff;border-radius:20px;padding:20px;width:100%;max-width:420px;max-height:90vh;overflow:auto}
.dlg h3{margin:0 0 8px;font-size:1.35rem}
.dlg p{margin:0 0 16px}
.dlg .btns{display:grid;gap:10px}
.dlg textarea{width:100%;height:200px;border:2px solid var(--line);border-radius:12px;padding:10px;font-size:.9rem;margin-bottom:12px}
.sheet{position:fixed;inset:0;background:var(--bg);z-index:40;display:flex;flex-direction:column}
.sheet .sb{flex:1;overflow:auto;padding:18px 16px 24px;-webkit-overflow-scrolling:touch}
.sheet .sbi{max-width:640px;margin:0 auto}
.sheet .nav{position:static}
#toast{position:fixed;left:16px;right:16px;bottom:calc(env(safe-area-inset-bottom) + 112px);max-width:600px;margin:0 auto;background:var(--ink);color:#fff;padding:14px 16px;border-radius:14px;font-weight:700;text-align:center;opacity:0;pointer-events:none;transition:opacity .2s;z-index:80}
#toast.on{opacity:1}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

(()=>{

/* ========== definiciones ========== */
const TIPOS={
 quimica:{flow:'lim',label:'Química',short:'Desinfección química',full:'Limpieza y desinfección química',c:'#1E40AF',d:'#1E3A8A',t:'#E1E9FF',file:'Desinfeccion_Quimica',icon:'flask'},
 termica:{flow:'lim',label:'Térmica',short:'Desinfección térmica',full:'Limpieza y desinfección térmica',c:'#C2410C',d:'#7C2D12',t:'#FFE8DA',file:'Desinfeccion_Termica',icon:'therm'},
 legionella:{flow:'mue',label:'Legionella',short:'Muestras Legionella',full:'Toma de muestras · Legionella (RD 487/2022)',c:'#15803D',d:'#14532D',t:'#DCF5E4',file:'Muestras_Legionella',icon:'drop'},
 piscina:{flow:'mue',label:'Piscina',short:'Muestras Piscina',full:'Toma de muestras · Piscina',c:'#0284C7',d:'#075985',t:'#DBF0FC',file:'Muestras_Piscina',icon:'waves'}
};

 lim:[['inst','Tipo de instalación'],['tipo','Tipo de desinfección'],['datos','Datos'],['dep','Depósitos de agua fría sanitaria'],['acu','Acumuladores de agua caliente sanitaria'],['pts','Mediciones por punto'],['obs','Observaciones'],['res','Resumen']],
 mue:[['tipo','Tipo de muestreo'],['datos','Datos'],['pts','Puntos de muestreo'],['obs','Observaciones'],['res','Resumen']]
};

const instLabel=f=>!f.tipoInst||!INST[f.tipoInst]?'—':f.tipoInst==='otra'?(f.tipoInstOtro&&f.tipoInstOtro.trim()?f.tipoInstOtro.trim():'Otra'):INST[f.tipoInst][0]+(INST[f.tipoInst][1]?' ('+INST[f.tipoInst][1]+')':'');
const MATS=['Poliéster / fibra','Acero inoxidable','Acero galvanizado','Polietileno','Hormigón','Otro'];

 quimica:[['nom','Punto',''],['agua','Tipo de agua',''],['hora','Hora',''],['cli','Cloro inicial','ppm'],['clf','Cloro final','ppm'],['ph','pH',''],['temp','Temperatura','°C']],
 termica:[['nom','Punto',''],['hora','Hora',''],['ti','Temp. inicial','°C'],['tf','Temp. final','°C']],
 legionella:[['nom','Punto de muestreo',''],['agua','Tipo de agua',''],['an','Análisis',''],['temp','Temperatura','°C'],['cl','Cloro','ppm'],['ph','pH','']],

function newFicha(flow){
 return{id:uid(),flow,tipo:null,tipoInst:flow==='lim'?'sanitaria':'',tipoInstOtro:'',instalacion:'',fecha:todayISO(),hora:nowHM(),responsable:'',telefono:'',

/* adapta fichas guardadas con el formato anterior (un solo depósito / acumulador) */
function normF(f){
 if(!f||typeof f!=='object')return f;
 if(f.flow==='lim'){
  if(!Array.isArray(f.deps)){f.deps=[];if(f.deposito===true&&f.dep)f.deps.push({cant:f.dep.cant||1,cap:f.dep.cap||'',material:f.dep.material||null,limpieza:f.dep.limpieza==null?null:f.dep.limpieza});delete f.dep}

 }

 if(tipo==='quimica')return{nom:'',agua:null,hora:nowHM(),cli:'',clf:'',ph:'',temp:''};

function persistLocal(){if(!lsSet(LS_F,fichas))toast('No se pudo guardar en el móvil. Exporta una copia de seguridad.')}

/* sacar archivos: menú de compartir del móvil o descarga normal */
function downloadBlob(name,blob){
 const a=document.createElement('a'),u=URL.createObjectURL(blob);
 a.href=u;a.download=name;a.rel='noopener';document.body.appendChild(a);a.click();
 setTimeout(()=>{a.remove();URL.revokeObjectURL(u)},4000);
}
async function shareFile(name,blob,type){
 try{
  const file=new File([blob],name,{type});
  if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:name});return true}
 }catch(e){if(e&&e.name==='AbortError')return true}
 return false;
}

function pv(d,p,withUnit){
 const k=d[0],unit=d[2];let v=p[k];
 if(k==='agua')return AGUA[v]||'—';
 if(k==='an')return anLabel(v);

function datosRows(f){

 if(f.flow==='lim')r.push(['Tipo de instalación',instLabel(f)]);
 r.push(['Fecha',fmtDate(f.fecha)],[f.flow==='lim'?'Hora de inicio':'Hora de la toma de muestras',f.hora||'—']);
 if(f.flow==='lim'){r.push(['Responsable',f.responsable||'—']);r.push(['Teléfono',f.telefono||'—'])}

}
function grpLine(g,mat){return (g.cant||1)+' × '+(g.cap?g.cap+' L':'— L')+(mat?' · '+(g.material||'sin material'):'')+' · Limpieza: '+yn(g.limpieza)}
function grpTxt(g,mat){return (g.cant||1)+' x '+(g.cap?g.cap+' L':'? L')+(mat?', '+(g.material||'sin material'):'')+', limpieza '+yn(g.limpieza)}
function depRows(on,arr,mat,noun){

function kvHTML(rows){return '<dl class="kv">'+rows.map(r=>'<dt>'+esc(r[0])+'</dt><dd>'+esc(r[1])+'</dd>').join('')+'</dl>'}
function section(title,body,step,editable){

function summaryHTML(f,editable){
 const T=TIPOS[f.tipo];
 let h='';
 if(T)h+='<div class="sm" style="border-color:var(--c);background:var(--ct)"><b style="color:var(--cd);font-size:1.2rem">'+esc(T.full)+'</b></div>';

 if(f.flow==='lim'){
  h+=section('Depósitos de agua fría sanitaria',kvHTML(depRows(f.deposito,f.deps,true,'depósito')),'dep',editable);
  h+=section('Acumuladores de agua caliente sanitaria',kvHTML(depRows(f.acum,f.acs,false,'acumulador')),'acu',editable);
 }
 let pts='';
 if(!f.puntos.length)pts='<p class="muted" style="margin:0">Sin puntos.</p>';
 else if(f.tipo)pts=f.puntos.map((p,i)=>{
  const defs=PTDEF[f.tipo].filter(d=>d[0]!=='nom');
  return '<div class="ptb"><div class="pth"><span class="pn">'+(i+1)+'</span>'+esc(p.nom||'Sin nombre')+'</div>'+kvHTML(defs.map(d=>[d[1],pv(d,p,true)]))+'</div>';
 }).join('');
 h+=section(f.flow==='lim'?'Mediciones por punto':'Puntos de muestreo',pts,'pts',editable);
 h+=section('Observaciones','<div class="obs">'+(f.obs&&f.obs.trim()?esc(f.obs):'<span class="muted">Sin observaciones.</span>')+'</div>','obs',editable);
 return h;

function textSummary(f){
 const T=TIPOS[f.tipo]||{full:'Ficha'};
 const L1=['KGS Soluciones - '+T.full,''];
 datosRows(f).forEach(r=>L1.push(r[0]+': '+r[1]));
 if(f.flow==='lim'){
  L1.push('');
  L1.push('Depósitos: '+(f.deposito===true?(f.deps||[]).map(g=>grpTxt(g,true)).join(' | ')||'Sí':yn(f.deposito)));
  L1.push('Acumuladores: '+(f.acum===true?(f.acs||[]).map(g=>grpTxt(g,false)).join(' | ')||'Sí':yn(f.acum)));
 }
 L1.push('');L1.push(f.flow==='lim'?'Mediciones:':'Puntos:');
 f.puntos.forEach((p,i)=>{
  L1.push((i+1)+') '+(p.nom||'Sin nombre')+' - '+PTDEF[f.tipo].filter(d=>d[0]!=='nom').map(d=>d[1]+': '+pv(d,p,true)).join('; '));
 });
 if(f.obs&&f.obs.trim()){L1.push('');L1.push('Observaciones: '+f.obs.trim())}
 L1.push('');L1.push('Técnico: Carlos Javier García (Dpto. Técnico)');
 return L1.join('\n');
}

async function ensureLib(){

}

 };

 };

   const cs={0:{cellWidth:18,halign:'center'},1:{halign:'center'},2:{halign:'center'}};

  };

 }

 }
 return doc.output('blob');
}

function csvAll(){
 const H=['ID','Trabajo','Instalación','Tipo de instalación','Fecha','Hora','Responsable','Teléfono','Depósito','Depósitos (detalle)','Acumulador','Acumuladores (detalle)','Nº punto','Punto','Tipo de agua','Análisis','Hora medición','Cloro inicial (ppm)','Cloro final (ppm)','pH','Temperatura (°C)','Temperatura inicial (°C)','Temperatura final (°C)','Cloro (ppm)','Cloro libre (ppm)','Cloro residual (ppm)','Cloro total (ppm)','Turbidez (UNF)','Transparencia','Ácido isocianúrico (mg/L)','Observaciones'];
 const MAP={
  quimica:{nom:'Punto',agua:'Tipo de agua',hora:'Hora medición',cli:'Cloro inicial (ppm)',clf:'Cloro final (ppm)',ph:'pH',temp:'Temperatura (°C)'},
  termica:{nom:'Punto',hora:'Hora medición',ti:'Temperatura inicial (°C)',tf:'Temperatura final (°C)'},
  legionella:{nom:'Punto',agua:'Tipo de agua',an:'Análisis',temp:'Temperatura (°C)',cl:'Cloro (ppm)',ph:'pH'},
  piscina:{nom:'Punto',clL:'Cloro libre (ppm)',clR:'Cloro residual (ppm)',clT:'Cloro total (ppm)',ph:'pH',turb:'Turbidez (UNF)',transp:'Transparencia',cya:'Ácido isocianúrico (mg/L)'}
 };
 const q=v=>{v=String(v==null?'':v);return /[";\n\r]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
 const rows=[H];
 Object.values(fichas).sort((a,b)=>(a.fecha+(a.hora||'')).localeCompare(b.fecha+(b.hora||''))).forEach(f=>{
  const T=TIPOS[f.tipo]||{short:''};
  const lim=f.flow==='lim';
  const baseR={ID:f.id,Trabajo:T.short,'Instalación':f.instalacion,'Tipo de instalación':lim?instLabel(f):'',Fecha:fmtDate(f.fecha),Hora:f.hora,Responsable:lim?f.responsable:'','Teléfono':lim?f.telefono:'',Observaciones:f.obs};
  if(lim){
   baseR['Depósito']=yn(f.deposito);
   if(f.deposito===true)baseR['Depósitos (detalle)']=(f.deps||[]).map(g=>grpTxt(g,true)).join(' | ');
   baseR['Acumulador']=yn(f.acum);
   if(f.acum===true)baseR['Acumuladores (detalle)']=(f.acs||[]).map(g=>grpTxt(g,false)).join(' | ');
  }
  const list=f.puntos.length?f.puntos:[null];
  list.forEach((p,i)=>{
   const r=Object.assign({},baseR);
   if(p){r['Nº punto']=i+1;const m=MAP[f.tipo]||{};Object.keys(m).forEach(k=>{r[m[k]]=k==='agua'?(AGUA[p[k]]||''):k==='an'?(Array.isArray(p[k])?anLabel(p[k]).replace('—',''):''):p[k]})}
   rows.push(H.map(h=>q(r[h])));
  });
 });
 return '﻿'+rows.map(r=>Array.isArray(r)?r.join(';'):r.map(q).join(';')).join('\r\n');
}

/* ========== acciones ========== */
function startForm(f,step){S.ficha=f;S.step=step;S.pt=null;S.ptIdx=-1;S.view='form';saveDraft();render()}
async function ensureNoDraft(){
 const d=readDraft();
 if(!d||!d.f)return true;
 const r=await dialog({title:'Tienes una ficha sin terminar',text:'¿Qué quieres hacer con ella?',btns:[{l:'Continuar la anterior',v:'c',cls:'pri'},{l:'Descartarla y seguir',v:'d',cls:'bad'},{l:'Cancelar',v:'x'}]});
 if(r==='c'){resumeDraft();return false}
 if(r==='d'){clearDraft();return true}
 return false;
}
function resumeDraft(){
 const d=readDraft();if(!d)return;
 S.ficha=normF(d.f);S.step=Math.min(d.step||0,STEPS[d.f.flow].length-1);S.pt=d.pt||null;S.ptIdx=d.ptIdx==null?-1:d.ptIdx;S.view='form';render();
}
const parseV=v=>v==='true'?true:v==='false'?false:v;
const acts={
 async new(el){if(!(await ensureNoDraft()))return;startForm(newFicha(el.dataset.flow),0)},
 resume(){resumeDraft()},
 async discard(){if(await confirmBox('¿Descartar la ficha sin terminar?','Se perderán los datos que no hayas guardado.','Descartar')){clearDraft();render(true)}},
 tipo(el){S.ficha.tipo=el.dataset.v;saveDraft();render(true)},
 set(el){
  set(el.dataset.b,parseV(el.dataset.v));
  const f=S.ficha;
  if(f&&el.dataset.b==='ficha.deposito'&&f.deposito===true&&!f.deps.length)f.deps.push({cant:1,cap:'',material:null,limpieza:null});
  if(f&&el.dataset.b==='ficha.acum'&&f.acum===true&&!f.acs.length)f.acs.push({cant:1,cap:'',limpieza:null});
  touchDraft();refresh();
 },
 tog(el){
  const a=(get(el.dataset.b)||[]).slice(),v=el.dataset.v,i=a.indexOf(v);
  if(i>=0)a.splice(i,1);else a.push(v);
  set(el.dataset.b,ANO.filter(k=>a.includes(k)));touchDraft();refresh();
 },
 an3(){set('pt.an',ANO.slice());touchDraft();refresh()},
 grpadd(el){const k=el.dataset.k;S.ficha[k].push(k==='deps'?{cant:1,cap:'',material:null,limpieza:null}:{cant:1,cap:'',limpieza:null});saveDraft();render(true)},
 async grpdel(el){
  const k=el.dataset.k,i=+el.dataset.i;
  if(await confirmBox('¿Quitar el grupo '+(i+1)+'?','Se borrarán sus datos.','Quitar grupo')){S.ficha[k].splice(i,1);saveDraft();render(true)}
 },
 stp(el){
  const k=el.dataset.k,list=L[k],cur=get(el.dataset.b)||'';let i=list.indexOf(cur);
  if(i<0)i=list.indexOf(LDEF[k]);else i=Math.max(0,Math.min(list.length-1,i+(+el.dataset.d)));
  const v=list[i];set(el.dataset.b,v);
  const sel=document.querySelector('select[data-b="'+el.dataset.b+'"]');if(sel)sel.value=v;
  touchDraft();
 },
 cnt(el){
  const p=el.dataset.b,v=Math.max(1,Math.min(99,(+get(p)||1)+(+el.dataset.d)));set(p,v);
  const o=document.querySelector('output[data-o="'+p+'"]');if(o)o.textContent=v;touchDraft();
 },
 now(el){const v=nowHM();set(el.dataset.b,v);const i=document.querySelector('input[data-b="'+el.dataset.b+'"]');if(i)i.value=v;touchDraft()},
 goto(el){const i=STEPS[S.ficha.flow].findIndex(s=>s[0]===el.dataset.s);if(i>=0){S.step=i;if(S.pt){S.pt=null;S.ptIdx=-1}saveDraft();render()}},
 next(){
  const f=S.ficha;
  if(STEPS[f.flow][S.step][0]==='tipo'&&!f.tipo){toast('Elige un tipo para continuar');return}
  S.step++;saveDraft();render();
 },
 back(){if(S.step===0){acts.exit();return}S.step--;saveDraft();render()},
 exit(){saveDraft();S.view='home';S.ficha=null;S.pt=null;render()},
 ptadd(){S.pt=newPunto(S.ficha.tipo);S.ptIdx=-1;saveDraft();renderSheet()},
 ptedit(el){S.ptIdx=+el.dataset.i;S.pt=clone(S.ficha.puntos[S.ptIdx]);saveDraft();renderSheet()},
 async ptdel(el){const i=+el.dataset.i;if(await confirmBox('¿Borrar el punto '+(i+1)+'?',(S.ficha.puntos[i].nom||'Sin nombre'),'Borrar punto')){S.ficha.puntos.splice(i,1);saveDraft();render(true)}},
 ptsave(){
  if(S.ptIdx>=0)S.ficha.puntos[S.ptIdx]=clone(S.pt);else S.ficha.puntos.push(clone(S.pt));
  S.pt=null;S.ptIdx=-1;saveDraft();render(true);
 },
 ptcancel(){S.pt=null;S.ptIdx=-1;saveDraft();renderSheet()},
 save(){finishSave()},
 open(el){S.id=el.dataset.id;S.view='detail';render()},
 async edit(el){
  if(!(await ensureNoDraft()))return;
  const f=clone(fichas[el.dataset.id]);startForm(f,STEPS[f.flow].length-1);
 },
 async del(el){if(await confirmBox('¿Borrar esta ficha?','Se eliminará del historial y no se podrá recuperar.','Borrar ficha')){deleteFicha(el.dataset.id);S.view='home';render();toast('Ficha borrada')}},
 share(el){S.id=el.dataset.id;S.fromSave=false;S.view='done';render();genPDF(fichas[S.id])},
 sharepdf(){sharePDF()},
 dlpdf(){dlPDF()},
 retrypdf(){S.pdfErr=false;render(true);genPDF(fichas[S.id])},
 copy(){copyText(textSummary(fichas[S.id]))},
 home(){S.view='home';S.ficha=null;S.pt=null;S.id=null;render()},
 csv(){
  if(!Object.keys(fichas).length){toast('Todavía no hay fichas que descargar');return}
  downloadBlob('Fichas_KGS_'+todayISO()+'.csv',new Blob([csvAll()],{type:'text/csv;charset=utf-8'}));
 },
 async backup(){
  if(!Object.keys(fichas).length){toast('Todavía no hay fichas que guardar');return}
  const name='KGS_copia_seguridad_'+todayISO()+'.json';
  const blob=new Blob([JSON.stringify({app:'kgs-fichas',v:1,fecha:new Date().toISOString(),fichas:Object.values(fichas)})],{type:'application/json'});
  if(await shareFile(name,blob,'application/json'))return;
  downloadBlob(name,blob);
 },
 restore(){const i=$('#rest');if(i)i.click()},
 hidehint(){lsSet('kgs_hint_off',1);render(true)}
};
document.addEventListener('click',e=>{
 const el=e.target.closest('[data-act]');
 if(!el||el.closest('.ov'))return;
 const fn=acts[el.dataset.act];
 if(fn){const r=fn(el);if(r&&r.catch)r.catch(x=>console.warn(x))}
});
async function importFile(file){
 if(!file)return;
 try{
  const j=JSON.parse(await file.text());
  const arr=Array.isArray(j)?j:Array.isArray(j.fichas)?j.fichas:[];
  let n=0;
  arr.forEach(x=>{
   if(!x||!x.id||!x.flow||!TIPOS[x.tipo])return;
   const f=normF(x);
   if(!fichas[f.id]||(f.updated||0)>(fichas[f.id].updated||0)){fichas[f.id]=f;n++}
  });
  persistLocal();
  const h=$('#hist');if(h)h.innerHTML=histHTML();
  toast(n?'Fichas importadas: '+n:'No había fichas nuevas en ese archivo');
 }catch(e){toast('No se pudo leer ese archivo')}
}
function onField(e){
 const t=e.target;
 if(t.id==='rest'){importFile(t.files&&t.files[0]);t.value='';return}
 if(t.id==='q'){S.q=t.value;const h=$('#hist');if(h)h.innerHTML=histHTML();return}
 const p=t.dataset&&t.dataset.b;if(!p||t.tagName==='BUTTON')return;
 let v=t.value;
 if('dec' in t.dataset){
  v=v.replace(/\./g,',').replace(/[^0-9,]/g,'');
  const i=v.indexOf(',');if(i>=0)v=v.slice(0,i+1)+v.slice(i+1).replace(/,/g,'');
  if(v!==t.value)t.value=v;
 }
 if('int' in t.dataset){v=v.replace(/\D/g,'');if(v!==t.value)t.value=v}
 set(p,v);touchDraft();
}
document.addEventListener('input',onField);
document.addEventListener('change',onField);
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.tagName==='INPUT'&&e.target.type!=='search')e.target.blur()});
document.addEventListener('visibilitychange',()=>{if(document.hidden)saveDraft()});
window.addEventListener('pagehide',saveDraft);

/* ========== arranque ========== */
(function init(){
 const f=lsGet(LS_F);if(f&&typeof f==='object'&&!Array.isArray(f)){fichas=f;Object.values(fichas).forEach(normF)}
 render();
 try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
 try{if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{})}catch(e){}
 window.__kgs={S,acts,get fichas(){return fichas},csvAll,makePDF,ensureLib,textSummary,missing};
})();
})();
</script>
